name: CI

# Automatic runs are intentionally off (owner decision 2026-11-03: stop runner spend).
# Run manually with `gh workflow run ci.yml`, or locally with `pnpm run ci && pnpm run test:locked`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-perfect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release, package, skills, paths, and tests
        run: pnpm run ci
