name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: pixel-perfect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # The locked-gate suite probes GitHub with `gh` (the run-02-hand proof-tier probe and its
    # replay reads), so this job asks for its own read-only scopes. Job-level is deliberate:
    # tighter than the workflow-level block above.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release, package, skills, paths, and tests
        run: pnpm run ci

      # The CI-runnable slice of the locked flow-gate suite (SN-1). Five locked files are excluded
      # because their OWN contracts need hosted or local run state a bare runner does not have:
      #   t18-question-boundary — its dispatched-pass leg is owned by the hosted harness-eval gate.
      #   run-02-hand — its live tier asserts hosted evidence (a real dispatch plus its run artifact).
      #   t11-controls-wiring, t13-smoke-observations — both execute the workflow's controls-producer,
      #     which reads hosted Actions-run facts. t12-review-record — reads a gitignored run record.
      #   t17-verify-report-writer — its count-guard re-runs the six locked siblings, incl. run-02-hand.
      # `pnpm test:locked` (the full glob, unchanged) remains the local/hosted gate for all of them.
      - name: Run the locked flow-gate suite (hosted/local-state files excluded — see comment)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run test:locked:ci
        timeout-minutes: 15
