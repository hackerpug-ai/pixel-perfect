name: harness-eval

# One invocation = one install mode = twelve cells.
#
# Sprint 01 ships only the hand dispatch (UC-RUN-02). The nightly `schedule` (UC-RUN-01) and
# the post-merge `push` (UC-RUN-03) triggers belong to a later sprint and must land there,
# with the dispatch-eligibility rules in 09-technical-requirements/04-api-design.md.
#
# Banned events — never add these: pull_request, pull_request_target, workflow_run.
# A pull request is never what starts this grade.
on:
  workflow_dispatch:
    inputs:
      install_mode:
        description: Where the plugin under test comes from. checkout grades the dispatch commit; published grades the resolved release.
        type: choice
        options:
          - checkout
          - published
        default: checkout

# Default permissions are empty. Every job opts in to the narrowest scope it needs.
permissions: {}

# A new dispatch never cancels a grade already in progress.
concurrency:
  group: harness-eval
  cancel-in-progress: false

jobs:
  drift:
    name: drift proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the dispatch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Package-manager cache is allowed on this job only: it holds no harness key.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      # The existing release proof. A moved rule fails here, independently of any grade.
      - name: Re-run the release proof
        run: |
          set -o pipefail
          pnpm run verify 2>&1 | tee harness-eval-drift.log

      - name: Upload the drift record even when the proof failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness-eval-drift.log
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

  smoke:
    name: smoke ${{ matrix.harness }} ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # T9 finishes the harness-smoke binding. Only that cell's own smoke step ever holds that
    # harness's key; no install, marketplace, plugin-install or command-list step holds one.
    environment: harness-smoke
    strategy:
      fail-fast: false
      matrix:
        harness: [claude-code, codex, grok, opencode, pi, cursor]
        track: [pinned, newest]
    steps:
      - name: Check out the dispatch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Install slot — deliberately keyless. T2 owns the pins, T5 owns the per-harness install
      # command (the CLI invocation boundary is another lens's contract), T9 owns the key.
      #
      # The version is resolved for the track (the pin for `pinned`, the run's frozen newest lookup
      # for `newest`), installed exactly with auto-update off, and followed by the keyless checkout
      # load into an isolated CLAUDE_CONFIG_DIR. The load's record — the identity it measured — is
      # what the keyed step below attributes its grades to; the step exits 0 and names any refusal
      # in cell/install.json, so a failed install is a named cell, not a missing one.
      - name: Install ${{ matrix.harness }} ${{ matrix.track }}
        run: |
          set -eu
          mkdir -p cell
          node test/harness/smoke/install.mjs '${{ matrix.harness }}' '${{ matrix.track }}' --install-mode '${{ inputs.install_mode }}' --cell-dir cell

      # --- T9: the credential binding -----------------------------------------------------
      # A cell's own model step is the ONLY step in this workflow that may hold that harness's
      # key, and its `if:` keeps the other eleven cells out of it, so no cell ever receives a key
      # it does not consume. The install, record, upload, download, drift and recorder steps stay
      # keyless. Each step records credential PRESENCE — names and booleans, never a value — and
      # runs the cell through the registry, so a harness whose key is not in the environment reads
      # `could-not-run / missing-api-key` instead of passing.
      # The graded invocations live here because this is where the key is: the registry answers
      # first, an absent adapter is present-as-could-not-run, and the loaded adapter grades from
      # captured bytes. Environment, the five names and the placement rule: test/harness/ENVIRONMENT.md.
      - name: Smoke model step claude-code ${{ matrix.track }}
        if: matrix.harness == 'claude-code'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SMOKE_CLAUDE_KEY }}
        run: |
          set -eu
          mkdir -p cell
          node test/harness/smoke/model-step.mjs 'claude-code' '${{ matrix.track }}' --install-mode '${{ inputs.install_mode }}' --cell-dir cell

      - name: Smoke model step codex ${{ matrix.track }}
        if: matrix.harness == 'codex'
        env:
          CODEX_API_KEY: ${{ secrets.SMOKE_CODEX_KEY }}
        run: |
          set -eu
          mkdir -p cell
          node test/harness/smoke/model-step.mjs 'codex' '${{ matrix.track }}' --install-mode '${{ inputs.install_mode }}' --cell-dir cell

      # grok's keyed step passes no --trust: a keyed invocation never widens its own permissions.
      - name: Smoke model step grok ${{ matrix.track }}
        if: matrix.harness == 'grok'
        env:
          XAI_API_KEY: ${{ secrets.SMOKE_GROK_KEY }}
        run: |
          set -eu
          mkdir -p cell
          node test/harness/smoke/model-step.mjs 'grok' '${{ matrix.track }}' --install-mode '${{ inputs.install_mode }}' --cell-dir cell

      # opencode's pinned provider is anthropic, so its key reaches ANTHROPIC_API_KEY — in this cell
      # only, from its own environment secret. No --auto: a keyed step never self-approves.
      - name: Smoke model step opencode ${{ matrix.track }}
        if: matrix.harness == 'opencode'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SMOKE_OPENCODE_KEY }}
        run: |
          set -eu
          mkdir -p cell
          node test/harness/smoke/model-step.mjs 'opencode' '${{ matrix.track }}' --install-mode '${{ inputs.install_mode }}' --cell-dir cell

      - name: Smoke model step pi ${{ matrix.track }}
        if: matrix.harness == 'pi'
        env:
          GEMINI_API_KEY: ${{ secrets.SMOKE_PI_KEY }}
        run: |
          set -eu
          mkdir -p cell
          node test/harness/smoke/model-step.mjs 'pi' '${{ matrix.track }}' --install-mode '${{ inputs.install_mode }}' --cell-dir cell

      # cursor has no secret in harness-smoke and invents none: its cell resolves the same guard,
      # records could-not-run / missing-api-key, and is never omitted from the grid.
      - name: Smoke model step cursor ${{ matrix.track }}
        if: matrix.harness == 'cursor'
        run: |
          set -eu
          mkdir -p cell
          node test/harness/smoke/model-step.mjs 'cursor' '${{ matrix.track }}' --install-mode '${{ inputs.install_mode }}' --cell-dir cell

      # The keyless control. It binds nothing, asserts in-step that the consumed key AND every
      # permitted fallback are absent, then asks the real guard what a keyless invocation is:
      # could-not-run / missing-api-key with zero model requests. It runs beside the authenticated
      # claude-code cells, so one run carries both the refusal and the grades it must not resemble.
      # An unset environment secret reaches this step's binding as "", not undefined, so the guard
      # is the empty-string shape a hosted runner really produces. The zero-request count is read
      # off the guard's own capture and the no-spawn claim off a marker file that would exist only
      # if a child had started, so neither half of the row is a constant copied from the refusal.
      - name: Keyless control - a missing credential must refuse
        if: matrix.harness == 'claude-code' && matrix.track == 'pinned'
        run: |
          set -eu
          mkdir -p cell
          for name in ANTHROPIC_API_KEY CODEX_API_KEY XAI_API_KEY GEMINI_API_KEY CURSOR_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "::error::the keyless control is invalid: $name is present on this step, so absence would prove nothing"
              exit 1
            fi
          done
          node --input-type=module -e '
          import { existsSync, writeFileSync } from "node:fs";
          import { createCapture } from "./test/harness/runtime/capture.mjs";
          import { runGuarded } from "./test/harness/runtime/guard.mjs";
          const marker = "cell/child-ran.marker";
          const capture = createCapture({ harness: "claude-code", check_id: "verify", cwd: process.cwd(), timeout_ms: 20000 });
          const { decision } = await runGuarded({
            harness: "claude-code",
            stance: null,
            capture,
            command: process.execPath,
            args: ["-e", `require("node:fs").writeFileSync(${JSON.stringify(marker)}, "ran")`],
            timeout_ms: 20000,
          });
          const record = capture.persist("cell/evidence");
          const row = { control_id: "missing-key", verdict: decision.refusal?.verdict ?? "pass", reason: decision.refusal?.reason ?? null, model_requests: record.model_request_count, child_ran: existsSync(marker), capture_path: (record.evidence_paths ?? []).find((p) => p.endsWith(".capture.json")) ?? null };
          writeFileSync("cell/keyless-control.json", JSON.stringify(row) + "\n");
          console.log(JSON.stringify(row));
          // The observation travels on the cell record: that file is the only thing this job ships,
          // so an observation kept beside it would never leave the runner. The path is composed at
          // run time so this KEYLESS step never becomes the first match in the recorder lookup.
          const { attachMissingKey } = await import("./test/harness/smoke/observations.mjs");
          const attached = attachMissingKey({ row, cellFile: ["cell", "cell.json"].join("/") });
          console.log(JSON.stringify({ attached: attached.ok, why: attached.reason ?? null }));
          if (row.verdict !== "could-not-run" || row.reason !== "missing-api-key" || row.model_requests !== 0 || row.child_ran !== false) {
            console.error("::error::the keyless control did not refuse with missing-api-key and zero model requests: " + JSON.stringify(row));
            process.exit(1);
          }
          '

      # The cell records itself. A leg that graded writes its own record and this step passes it
      # through; a leg that produced nothing gets a named fallback whose reason is the failure it
      # stopped on (`cell/failure.json`) or `cell-not-recorded`. The verdict reports; the exit code
      # here never carries one.
      - name: Record the cell
        run: |
          set -eu
          mkdir -p cell
          if [ -s cell/cell.json ]; then
            echo "the leg recorded its own cell"
            cat cell/cell.json
            exit 0
          fi
          reason=cell-not-recorded
          if [ -f cell/failure.json ]; then
            reason=$(node -e 'const r = JSON.parse(require("node:fs").readFileSync("cell/failure.json", "utf8")); process.stdout.write(String(r.reason || "cell-not-recorded"))')
          fi
          printf '{"harness":"%s","track":"%s","cell_state":"could-not-run","reason":"%s","install_mode":"%s","event":"%s","run_id":"%s","run_attempt":"%s"}\n' \
            '${{ matrix.harness }}' '${{ matrix.track }}' "$reason" '${{ inputs.install_mode }}' '${{ github.event_name }}' '${{ github.run_id }}' '${{ github.run_attempt }}' \
            > cell/cell.json
          cat cell/cell.json

      - name: Upload this cell even when the smoke step failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-cell-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.harness }}-${{ matrix.track }}
          # Exactly the cell record. binding.json, the keyless row and the captures are control
          # evidence, not cell records: the recorder classifies every *.json under cells/ by what it
          # is and refuses what it cannot classify, so they must not ride in here.
          path: cell/cell.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

  download:
    name: download cell artifacts
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The workspace is reset and cloned BEFORE the cells are written into it.
      #
      # `actions/checkout@v4` clears $GITHUB_WORKSPACE either way: it deletes the directory's
      # contents when the directory is not a git repository (prepareExistingDirectory sets
      # remove=true), and runs `git clean -ffdx` when it is. So a checkout placed AFTER a
      # download-artifact step silently erases the artifact that step just fetched. That order is
      # what this task used to ship, and it cost the whole run: the producer then wrote
      # cells/controls.json into an emptied cells/ and the handoff below published a cells artifact
      # holding controls.json alone, so the grade job's readCellArtifacts returned 0 cells with 4
      # controls and collectCells refused cells-incomplete — no result, and the four rows never
      # reached the gate those rows exist for. `clean: false` does not help; the non-repository
      # branch still deletes the directory contents. The order is asserted by
      # tests/sprint-01/t11-controls-wiring.test.mjs so it cannot be undone by a later edit.
      - name: Check out the dispatch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The producer imports test/harness/controls/index.mjs out of this commit, so the tree has to
      # be on disk before it runs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # After the checkout, never before it: this is the step that writes cells/ into the workspace.
      - name: Fetch every cell from this attempt
        uses: actions/download-artifact@v4
        with:
          pattern: harness-eval-cell-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: cells
          merge-multiple: false

      # The four negative controls are produced here, beside the cells they belong to and BEFORE
      # they are handed on, so no attempt can publish a result whose `.controls[]` is empty.
      #
      # Why a step in this job and not a job of its own: `tests/sprint-01/run-02-hand.test.mjs`
      # (T1's locked FLOW-RUN-02-HAND) asserts the workflow's job list is exactly
      # [download, drift, grade, smoke]. A fifth job fails that flow, and that file is outside this
      # task's write scope — the task forbids buying green by editing it. The producer therefore
      # rides the job that already moves this attempt's cells, which is also where the file has to
      # end up.
      #
      # The module is T11's: assertControlRows refuses a set that is not exactly the four controls,
      # so an empty or partial array never reaches disk. A run that observed nothing writes four
      # could-not-run/control-unobservable rows — never a pass, never an omission. This step holds
      # no secret: a missing observation is an unobservable control by name, not an error.
      #
      # `if: always()` for the same reason the cells handoff below carries it: the receipt is part
      # of what a refused run reports, so a failed transfer must still leave the four rows (or the
      # producer's own refusal) behind rather than vanish into a skipped step.
      # The four observations come from the run's own measurements: each smoke leg attached what it
      # observed to its own cell record, and the cells dir this job already fetched carries them.
      # A job output, if a producer above ever sets one, is merged on top — an empty value means
      # "no extra observations", not a broken run. A control nobody observed stays
      # could-not-run / control-unobservable; there is no default pass to fill the gap.
      #
      # The walk is inline on purpose: this step runs against the checkout and nothing else (the
      # locked t11 flow executes this exact body in a sandbox where only test/harness/controls is
      # reachable), so it may import node builtins and the controls module, and no more.
      - name: Qualify the four negative controls
        if: always()
        run: |
          set -eu
          mkdir -p cells
          node --input-type=module -e '
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import { qualifyControls, assertControlRows, writeControls } from "./test/harness/controls/index.mjs";
          const walk = (dir, out = []) => {
            if (!statSync(dir, { throwIfNoEntry: false })?.isDirectory()) return out;
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const full = join(dir, entry.name);
              if (entry.isDirectory()) walk(full, out);
              else if (entry.isFile() && entry.name.endsWith(".json")) out.push(full);
            }
            return out;
          };
          const observations = {};
          for (const file of walk("cells")) {
            let record;
            try { record = JSON.parse(readFileSync(file, "utf8")); } catch { continue; }
            if (!record || typeof record !== "object" || typeof record.harness !== "string" || typeof record.track !== "string") continue;
            Object.assign(observations, record.control_observations ?? {});
          }
          const raw = String(process.env.HARNESS_EVAL_CONTROL_OBSERVATIONS ?? "").trim();
          if (raw !== "") Object.assign(observations, JSON.parse(raw));
          const rows = assertControlRows(qualifyControls({ observations }).rows);
          const written = writeControls({ file: "cells/controls.json", rows });
          console.log(JSON.stringify({ observed: Object.keys(observations), rows: rows.map((row) => `${row.control_id} ${row.verdict} ${row.reason}`) }));
          if (!written.ok) { console.error("controls.json did not read back: " + JSON.stringify(written.mismatches)); process.exit(1); }
          '

      - name: Hand the cells to the recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-cells-${{ github.run_id }}-${{ github.run_attempt }}
          path: cells/
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

  grade:
    name: grade recorder
    needs: download
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The recorder is the only job allowed to read trusted run/job metadata, so `actions: read` is
    # asked for here and nowhere else. No environment and no model key: this job grades nothing and
    # holds nothing secret. It runs even when the smoke matrix or the drift proof failed, so a broken
    # cell still produces evidence instead of a missing artifact.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the dispatch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No package-manager cache here: the recorder needs no dependency, and a cached tree is not
      # provenance for what was evaluated.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch the collected cells from this attempt
        uses: actions/download-artifact@v4
        with:
          name: harness-eval-cells-${{ github.run_id }}-${{ github.run_attempt }}
          path: cells

      # T7 uploads the verify reports per cell. They are bundled below under invocation-specific
      # paths, so two invocations can never collide.
      - name: Fetch the verify reports this attempt produced
        uses: actions/download-artifact@v4
        with:
          pattern: harness-eval-verify-*
          path: verify-reports
          merge-multiple: false

      # Validates every record, enforces the twelve unique cells, copies the real smoke-job
      # timestamps from the Actions API, writes the result atomically, renders the summary and
      # applies the exit rule. A refusal writes no result file at all.
      - name: Record the result
        env:
          INSTALL_MODE: ${{ inputs.install_mode }}
          HARNESS_EVAL_CELLS_DIR: cells
          HARNESS_EVAL_VERIFY_DIR: verify-reports
          HARNESS_EVAL_OUT_DIR: grade
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node test/harness/recorder.mjs 2>&1 | tee recorder.log

      # The refusal reason only ever exists in the step log, so the log rides along with the result:
      # on a refusal this step still uploads the named reason instead of failing on a missing file.
      - name: Upload the attempt-qualified result, or the refusal log when the recorder refused
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            grade/harness-eval-result.json
            recorder.log
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Upload the attempt-qualified verify reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-verify-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: grade/verify-reports
          if-no-files-found: error
          retention-days: 90
          overwrite: false
