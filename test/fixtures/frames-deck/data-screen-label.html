<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Screen Label Test Deck</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; background: white; }
    html[data-theme="dark"] body { background: #1a1a1a; color: #e0e0e0; }

    .header {
      position: sticky;
      top: 0;
      height: 60px;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
      z-index: 100;
    }
    html[data-theme="dark"] .header {
      background: #2a2a2a;
      border-bottom-color: #444;
    }

    [data-screen-label="Hero"] {
      width: 100%;
      height: 300px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
    }
    html[data-theme="dark"] [data-screen-label="Hero"] {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .slider-frame {
      width: 620px;
      height: 389px;
      background: white;
      border: 1px solid #ddd;
      margin: 20px;
    }
    html[data-theme="dark"] .slider-frame {
      background: #333;
      border-color: #555;
    }

    @media (max-width: 720px) {
      [data-screen-label="Hero"] {
        height: 200px;
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div data-pp-root>
    <div class="header">Header (sticky)</div>

    <section data-screen-label="Hero">
      Hero Section (No Border)
    </section>

    <div class="slider-frame" data-label="Proof Slider">Proof Slider (Bordered)</div>
  </div>

  <script>
    // Emulate prefers-color-scheme if data-theme is set
    if (document.documentElement.getAttribute('data-theme') === 'dark') {
      // CSS rules with [data-theme="dark"] will apply
    }
  </script>
</body>
</html>
