<!doctype html>
<html><head><meta charset="utf-8"><title>Bordered canvas (no .fr class)</title></head>
<body style="margin:0;background:#eee">
<section style="padding: 40px; display: flex; flex-direction: column; gap: 40px; width: 1200px;">
  <h1>Sheet 1</h1>
  <div style="width: 640px; height: 400px; border: 1px solid #3A3F47; background: #fff; position: relative;">
    <h2>Screen A</h2>
    <div style="width: 320px; height: 240px; border: 1px solid #999; margin: 20px;">nested card — must NOT be its own frame</div>
  </div>
  <div style="width: 390px; height: 300px; border: 1px solid #3A3F47; background: #fff;"><h2>Screen B mobile</h2></div>
  <div style="width: 120px; height: 60px; border: 1px solid #3A3F47;">tiny — below the size floor</div>
</section>
<script>
  // deck runtimes rewrite inline styles: hex becomes rgb() in the live DOM
  for (const el of document.querySelectorAll('[style]')) el.setAttribute('style', el.getAttribute('style'));
</script>
</body></html>
