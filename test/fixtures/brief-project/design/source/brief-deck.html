<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library reference</title>
  <style>
    :root { --bg: #f7f5f0; --ink: #1d2433; --muted: #6b7280; --accent: #2f5bd3; --line: #d9d4c7; }
    body { margin: 0; padding: 32px; background: var(--bg); color: var(--ink); font: 16px/1.5 Georgia, serif; }
    .fr { background: #ffffff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin: 0 0 32px; width: 720px; max-width: 100%; box-sizing: border-box; }
    h2 { font: 700 22px Georgia, serif; margin: 0 0 16px; }
    .search { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    .field { flex: 1; height: 40px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; font: 15px system-ui, sans-serif; }
    .icon { width: 16px; height: 16px; flex: none; }
    .btn { height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: #ffffff; font: 600 15px system-ui, sans-serif; display: inline-flex; align-items: center; }
    .row { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); font: 15px system-ui, sans-serif; }
    .row span:last-child { color: var(--muted); }
    .note { color: var(--muted); font: italic 16px Georgia, serif; margin: 8px 0 0; }
  </style>
</head>
<body>
  <div class="fr" data-label="Library search" data-route="/library" data-state="default">
    <h2>Library</h2>
    <div class="search">
      <div class="field"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>Search the library</div>
      <button class="btn">Search</button>
    </div>
    <p class="note">Recently opened: onboarding notes, token audit.</p>
  </div>

  <div class="fr" data-label="Library results" data-route="/library" data-state="results">
    <h2>Library</h2>
    <div class="search">
      <div class="field"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>design tokens</div>
      <button class="btn">Search</button>
    </div>
    <div class="row"><span>Onboarding notes</span><span>3 min read</span></div>
    <div class="row"><span>Token audit</span><span>12 pages</span></div>
    <div class="row"><span>Spacing sheet</span><span>2 pages</span></div>
  </div>
</body>
</html>
